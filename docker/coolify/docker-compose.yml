# SeaweedFS for Coolify: one `weed mini` process (master + volume + filer + S3
# + admin UI) on a single persistent volume.
#
# Coolify setup (Docker Compose build pack):
#   Docker Compose Location: /docker/coolify/docker-compose.yml
#   Domains -> seaweedfs:    https://s3.example.com:8333
#   Optional admin UI:       add https://admin.example.com:23646 to the same field
#
# Only the ports you attach a domain to are reachable from outside; nothing is
# published on the host. Every secret below is generated by Coolify on first
# deploy and shown under Environment Variables.
services:
  seaweedfs:
    build:
      # Relative to the repo root: Coolify runs compose with --project-directory
      # set to the Base Directory (/), not this file's directory.
      context: .
      dockerfile: docker/Dockerfile.coolify
      args:
        # Coolify passes the git SHA when Advanced -> "Source commit availability" is "Available during build".
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    # Lets Coolify offer these ports for domains (S3, admin UI). Not published
    # on the host; metrics (9327) stays unlisted so it never gets a domain.
    expose:
      - "8333"
      - "23646"
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      # Writes to master/volume/filer HTTP are accepted only from inside the
      # container; S3 and the admin UI reach them over loopback.
      - -whiteList=127.0.0.1
      # Not needed for an S3 deployment; each one is a listener plus goroutines.
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -master.telemetry=false
      - -filer.disableDirListing=true
      - -s3.allowedOrigins=${S3_ALLOWED_ORIGINS:-*}
      # Prometheus /metrics for a scraper on the same Coolify network. Never
      # attach a domain to this port.
      - -metricsPort=9327
    # Every entry must be KEY=value: Coolify turns this list into a map, and a
    # bare KEY becomes the non-string key 0, which compose rejects.
    environment:
      # start.sh refuses to boot if any of the next three is empty.
      # S3 admin identity: full access, for operators only.
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_S3}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_64_S3}
      - WEED_ADMIN_USER=${ADMIN_USER:-admin}
      - WEED_ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      # Scoped identity for applications: Get/Put/Head/Delete/List on
      # S3_APP_BUCKETS only, no bucket or policy management. Those buckets are
      # created on first start.
      - S3_APP_ACCESS_KEY=${SERVICE_USER_S3APP}
      - S3_APP_SECRET_KEY=${SERVICE_PASSWORD_64_S3APP}
      - S3_APP_BUCKETS=${S3_APP_BUCKETS:?}
      # Buckets whose objects anyone can GET by exact key; listing stays private.
      - S3_PUBLIC_READ_BUCKETS=${S3_PUBLIC_READ_BUCKETS:-}
      # JWTs between components: a request that reaches master, volume or filer
      # directly, bypassing S3 auth, is rejected without one of these.
      - WEED_JWT_SIGNING_KEY=${SERVICE_HEX_64_JWTWRITE}
      - WEED_JWT_SIGNING_READ_KEY=${SERVICE_HEX_64_JWTREAD}
      - WEED_JWT_FILER_SIGNING_KEY=${SERVICE_HEX_64_FILERWRITE}
      - WEED_JWT_FILER_SIGNING_READ_KEY=${SERVICE_HEX_64_FILERREAD}
      # Empty means start.sh's sandbox policy; "off" disables it. The default
      # lives in start.sh because Coolify escapes ' as \' in env values.
      - S3_CONTENT_SECURITY_POLICY=${S3_CONTENT_SECURITY_POLICY:-}
      # The public S3 URL, e.g. https://s3.example.com (no port). Optional:
      # signatures verify from the proxy's forwarded headers without it. Not
      # derived from SERVICE_URL_*, which can be Coolify's generated http domain
      # with the container port appended.
      - S3_EXTERNAL_URL=${S3_PUBLIC_URL:-}
      - WEED_S3_PUBLIC_ENDPOINT=${S3_PUBLIC_URL:-}
      # Buckets created on startup; defaults to S3_APP_BUCKETS.
      - S3_BUCKET=${S3_BUCKET:-}
      # Soft heap ceiling for the Go GC, e.g. 900MiB when the container has 1GiB.
      # Empty means unlimited.
      - GOMEMLIMIT=${GOMEMLIMIT:-}
    volumes:
      - seaweedfs-data:/data
    restart: unless-stopped
    # Bounded local logs; Coolify shows them under Logs.
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    # Lets leveldb and the volume index flush on redeploy.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  seaweedfs-data:
